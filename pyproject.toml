[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-platform"
version = "0.1.0"
description = "A modular quantitative research and portfolio analytics platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "scipy>=1.11,<2.0",
    "pydantic>=2.5,<3.0",
    "PyYAML>=6.0,<7.0",
    "yfinance>=0.2.50,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.9,<1.0",
]
dashboard = [
    "streamlit>=1.40,<2.0",
    "plotly>=5.24,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.poetry]
package-mode = false