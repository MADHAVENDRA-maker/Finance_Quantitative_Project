name: Keep FinSight Alive

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Check FinSight website
        run: |
          curl --silent --show-error \
            --max-time 60 \
            --output /dev/null \
            --write-out "HTTP status: %{http_code}\n" \
            https://finsight-mainsite.streamlit.app/

      - name: Report status
        if: success()
        run: echo "FinSight website responded successfully."